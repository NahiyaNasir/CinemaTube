name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://user:password@localhost:5432/test
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:5000
      ACCESS_TOKEN_SECRET: test-access-secret
      REFRESH_TOKEN_SECRET: test-refresh-secret
      ACCESS_TOKEN_EXPIRES_IN: 1d
      REFRESH_TOKEN_EXPIRES_IN: 7d
      BETTER_AUTH_SESSION_TOKEN_EXPIRES_IN: "604800"
      BETTER_AUTH_SESSION_TOKEN_UPDATE_AGE: "86400"
      EMAIL_SENDER_SMTP_USER: test@example.com
      EMAIL_SENDER_SMTP_PASS: test-password
      EMAIL_SENDER_SMTP_HOST: smtp.example.com
      EMAIL_SENDER_SMTP_PORT: "587"
      EMAIL_SENDER_SMTP_FROM: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test